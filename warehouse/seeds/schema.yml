version: 2

seeds:
  - name: free_email_domains
    description: >
      Free-email-provider domains whose presence as tier-2 DOMAIN evidence demotes a
      match to manual review (Task F; the register's before-tier-2-on-real-data gate).
      Rationale, research-verified from primary sources (2026-08-01): free-provider
      domains carry no company-identity signal — HubSpot's own company matching refuses
      freemail domains as company evidence and falls back to Website URL
      (knowledge.hubspot.com/object-settings/automatically-create-and-associate-companies-with-contacts),
      and its forms product maintains a blocked-domain list for the same providers
      (knowledge.hubspot.com/forms/what-domains-are-blocked-when-using-the-forms-email-domains-to-block-feature).
      This seed is VENDORED from the free-email-domains npm package (HubSpot-derived;
      MIT, exact-pinned in package.json, attribution in NOTICE) via
      scripts/generate-free-email-seed.ts — regenerate and commit the diff on a
      deliberate version bump, never at build time (warehouse inputs stay reviewable
      tree state). The upstream list includes free providers AND disposable/webmail
      hosts; both are correct here — the seed answers "does this domain identify a
      company?", and for either category it does not. A match on a listed domain
      demotes to manual review (conservative: a human decides; nothing is dropped).
      Content is pinned by sentinel + well-formedness + real-list demotion tests in
      ingest/test/free-email-blocklist.test.ts; the generator refuses malformed or
      example-universe entries. Domains are stored lowercase and compared against the
      model's normalized domain.
    columns:
      - name: domain
        data_tests: [not_null, unique]
