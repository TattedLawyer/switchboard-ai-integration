version: 2
models:
  - name: stg_crm__companies
    columns:
      - name: company_id
        data_tests: [unique, not_null]
      - name: name
        data_tests: [not_null]
  - name: stg_crm__contacts
    columns:
      - name: contact_id
        data_tests: [unique, not_null]
  - name: stg_crm__deals
    columns:
      - name: deal_id
        data_tests: [unique, not_null]
      - name: amount_cents
        # L4 decay detection: with L1 (ingest contract) active nothing NULL arrives
        # through a door, so a NULL here means enforcement decayed or a direct insert —
        # either deserves a loud build. Severity stays error.
        data_tests: [not_null]
  - name: stg_billing__customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: stg_billing__invoices
    columns:
      - name: invoice_id
        data_tests: [unique, not_null]
      - name: amount_cents
        # L4 decay detection: NULL means the L2 safe cast nullified a value that L1
        # should have quarantined at the door — enforcement decayed or a direct insert.
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              values: [created, paid, voided]
  - name: stg_billing__payments
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: amount_cents
        # L4 decay detection: same rationale as invoices — NULL = decayed enforcement.
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              values: [succeeded, failed]
  - name: stg_support__tickets
    columns:
      - name: ticket_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              values: [open, solved]
  - name: stg_support__csat
    columns:
      - name: csat_id
        data_tests: [unique, not_null]
      - name: ticket_id
        data_tests: [unique, not_null]
      - name: score
        # L4 decay detection: csat.recorded declares score required (numeric-contract.ts),
        # so a NULL survived either a decayed door or a direct insert.
        data_tests: [not_null]
