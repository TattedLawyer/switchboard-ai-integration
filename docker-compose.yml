services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: switchboard
      POSTGRES_PASSWORD: switchboard
      POSTGRES_DB: switchboard
    ports: ["5433:5432"]
    # Without this the database lives in the container's writable layer and `docker compose
    # down` destroys it — total, silent data loss from a routine command. A NAMED volume
    # rather than a bind mount: Docker manages permissions, which is the usual source of
    # postgres-in-docker permission failures on macOS. Proven by scripts/verify-durability.sh.
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchboard"]
      interval: 2s
      timeout: 2s
      retries: 15
  dbt:
    build: ./warehouse
    profiles: ["tools"]
    environment:
      DBT_HOST: postgres
      # 5432, NOT the 5433 above. This service reaches postgres over the compose network,
      # where the container listens on its own 5432 — `5433:5432` is a HOST publication and
      # does not exist inside the network. Stated explicitly rather than left to
      # warehouse/profiles.yml's default, whose default is the host port (5433) and is right
      # for the other context: a manual `dbt build` from the developer's shell. Leaving this
      # unset is what broke the chaos workflow's demo job on 1ae95ea —
      # `connection to server at "postgres" (172.18.0.2), port 5433 failed: Connection
      # refused` — after gate-H M7 correctly moved that default to 5433 for the host case.
      # Every real context names its own port; the default covers only manual host runs.
      DBT_PORT: "5432"
      DBT_USER: switchboard
      DBT_PASSWORD: switchboard
      DBT_DBNAME: switchboard
    volumes: ["./warehouse:/usr/app"]
    depends_on:
      postgres: { condition: service_healthy }

# Named volume for the database. Declared here so `docker compose down` detaches it
# instead of deleting it; removing it is then an explicit `docker compose down -v`.
volumes:
  pgdata:
