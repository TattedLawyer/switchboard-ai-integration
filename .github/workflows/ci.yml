name: ci
on:
  push:
  pull_request:
# B7: `push` + `pull_request` double-runs every PR-branch commit. One concurrency group
# per workflow+branch lets the newest run supersede its sibling ("only a single job or
# workflow using the same concurrency group will run at a time" — GitHub docs); the
# conditional keeps main-branch runs uncancelled, so a push to main never kills a
# release-relevant run mid-flight (the docs' own caveat on cancel-in-progress).
# Task F ride-along (register): `github.ref` alone did NOT dedupe across event types —
# a PR-branch commit runs as `refs/heads/<branch>` (push) AND `refs/pull/<n>/merge`
# (pull_request), two different refs, so the double-run B7 targeted survived between
# events (bitten live: the burn-wave PR run, 2026-08-01).
# Task G, SECOND attempt (register): F's fix
# (`github.event.pull_request.head.ref || github.ref`) STILL did not collapse the pair,
# observed live on the F push — the push event has no pull_request payload, so its arm
# falls through to `github.ref` = `refs/heads/<branch>`, while the PR event's
# `pull_request.head.ref` is the BARE `<branch>`: two spellings, two groups, both runs
# executed. Fix: normalize BOTH sides to the bare branch name — `github.head_ref` is
# the bare head branch on pull_request events (empty otherwise), `github.ref_name` is
# the bare branch on push events — so both events of one commit share one group.
# Expected on the next PR-branch push: ONE surviving CI run (the sibling cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
# SEC-M2: nothing in this workflow uses GITHUB_TOKEN, so it should not inherit the
# repository or organisation default scope.
permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector/pgvector: same image swap as docker-compose.yml (migration 023 needs
        # `create extension vector`); pinned to the same 0.8.6-pg16 so CI and dev agree.
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: switchboard
          POSTGRES_PASSWORD: switchboard
          POSTGRES_DB: switchboard
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U switchboard"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      DATABASE_URL: postgres://switchboard:switchboard@localhost:5433/switchboard
      # A1 (Phase 3, writer boundary): the agent's credential is REQUIRED and never
      # derived. Before this, nothing anywhere in the repo set AGENT_DATABASE_URL, so
      # every actual run of the agent took agent-db.ts's derivation path — meaning the
      # full-privilege DATABASE_URL was load-bearing inside the agent process in 100% of
      # existing configurations, while the docs claimed the opposite. Named explicitly
      # here so CI runs the posture the README publishes.
      AGENT_DATABASE_URL: postgres://switchboard_agent:switchboard_agent@localhost:5433/switchboard
      # CI runs the synthetic demo fixture on the published dev secrets BY DESIGN —
      # the same explicit opt-in demo.sh/chaos.sh declare. Without this, the A2
      # fail-closed gate (correctly) refuses to boot the pipeline. Proven live: the
      # first-ever CI run failed exactly here (2026-07-25, run 30157944913).
      ALLOW_DEV_SECRETS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # PRE-3 (#27): a dependency-advisory SIGNAL, deliberately NON-BLOCKING.
      # `|| true` is the point, not a shortcut: a single high-severity advisory in a
      # transitive dev dependency would pin this workflow red on something the repo
      # neither fixes nor ships, and a permanently red gate is a gate everyone learns to
      # ignore. The output is here to be read when someone wants the signal; the day this
      # should block, that is a decision with its own reasoning, not a `|| true` deletion.
      # Both halves — that it runs, and that it cannot fail the run — are pinned in
      # ingest/test/ci-dependency-audit.test.ts.
      - name: dependency advisories (non-blocking)
        run: npm audit --audit-level=high || true
      - name: typecheck
        run: npm run typecheck
      - name: migrate
        run: npm run migrate -w ingest
      # Migration 023's embedder/chunker tests construct the REAL local model, and the
      # weights are deliberately not in git (~560MB; vendor/models/MANIFEST.sha256 is the
      # committed trust anchor). Cached on the manifest's hash so the download happens
      # once per model revision; on miss, the fetch script downloads at the pinned
      # revision and verifies every byte against the manifest before installing — a
      # mismatch fails this step rather than poisoning the cache.
      - name: restore vendored embedding model
        uses: actions/cache@v4
        with:
          path: vendor/models
          key: embedding-model-${{ hashFiles('vendor/models/MANIFEST.sha256') }}
      - name: fetch + verify vendored embedding model (no-op on cache hit)
        run: bash scripts/fetch-embedding-model.sh
      - name: workspace test suites (incl. gating action-safety eval)
        # Teed, because the next step needs the per-workspace counts this prints.
        # pipefail so a red suite is still a red step through the pipe.
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/suite.log
      # Gate-H C1/I1: the two published headline numbers (README's test count and
      # KNOWN-ISSUES' scoreboard) are checked against the things they describe. Both
      # were wrong at the phase-2b close — 857 vs 883, and 20 open defects vs 31 — for
      # the same reason: a number a human maintains beside a thing a machine changes.
      - name: verify README + KNOWN-ISSUES counts against reality
        run: npx tsx scripts/verify-doc-counts.ts --suite-log /tmp/suite.log
      - name: seed pipeline fixture for dbt
        run: npx tsx scripts/ci-fixture.ts
      # B7: pin the interpreter instead of riding whatever python the runner image ships
      # (bare `pip` changes under your feet on image updates). Version-pinned dbt +
      # pinned python make the cache key meaningful; with no requirements file,
      # cache-dependency-path keys the pip cache on this workflow file, which is where
      # the pinned dbt version lives — the key changes exactly when the pin does.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: .github/workflows/ci.yml
      - name: dbt build + data tests
        # dbt-core co-pinned exactly (phase-close F3) — same pin, same rationale as
        # warehouse/Dockerfile: dbt-postgres alone lets dbt-core float across majors.
        #
        # GREEN CRITERION FOR THIS STEP IS NOT "dbt exited 0". dbt exits 0 on warnings,
        # and this build is EXPECTED to report exactly one:
        #
        #     ERROR=0, WARN=1 — assert_amounts_plausible, row DEMO-CH-0001
        #
        # The CI fixture deliberately seeds one above-bound charge (close F7) so the
        # unlikely-value warn surface is proven to fire end-to-end in the built
        # warehouse instead of passing vacuously. A SECOND warn would therefore hide
        # behind this one, so the step below asserts the warn set exactly — do not read
        # this step's green tick as "no warnings".
        run: |
          pip install dbt-postgres==1.11.0 dbt-core==1.12.0
          cd warehouse && dbt build --profiles-dir .
        env:
          DBT_HOST: localhost
          DBT_PORT: "5433"
      - name: verify dbt warn set is exactly the expected one
        # Reads dbt's own run_results.json (complete warn set + per-test row counts) and
        # assert_amounts_plausible's stored failures (row identity). Fails on an extra
        # warn, a missing expected warn, or a different flagged row.
        run: npx tsx scripts/verify-dbt-warns.ts
      - name: verify identity resolution against manifest
        run: npx tsx scripts/verify-identity.ts
      # Cold review I1: the dbt DAG's size is stated in four doc sentences and nothing
      # checked it — adding one seed moved it 98 -> 101 and three of the four went stale,
      # including the RUNBOOK sentence an operator uses to decide the pipeline is broken.
      # Same class as the suite count, so it gets the same treatment: derived from dbt's
      # own run_results.json + manifest.json artifacts, never from a hand-maintained number
      # and never from dbt's colorized stdout (parsing that is what took the suite gate red
      # in its first CI run). Same artifacts scripts/verify-dbt-warns.ts already reads.
      # Runs a second time here (the earlier invocation has no artifacts yet) rather than
      # moving the whole gate down, so a stale scoreboard still fails BEFORE the expensive
      # warehouse steps.
      - name: verify documented dbt totals against the build that just ran
        run: npx tsx scripts/verify-doc-counts.ts --suite-log /tmp/suite.log --dbt-artifacts warehouse/target
