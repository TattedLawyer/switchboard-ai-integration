name: ci
on:
  push:
  pull_request:
# B7: `push` + `pull_request` double-runs every PR-branch commit. One concurrency group
# per workflow+ref lets the newest run supersede its sibling ("only a single job or
# workflow using the same concurrency group will run at a time" — GitHub docs); the
# conditional keeps main-branch runs uncancelled, so a push to main never kills a
# release-relevant run mid-flight (the docs' own caveat on cancel-in-progress).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  suite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: switchboard
          POSTGRES_PASSWORD: switchboard
          POSTGRES_DB: switchboard
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U switchboard"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      DATABASE_URL: postgres://switchboard:switchboard@localhost:5433/switchboard
      # CI runs the synthetic demo fixture on the published dev secrets BY DESIGN —
      # the same explicit opt-in demo.sh/chaos.sh declare. Without this, the A2
      # fail-closed gate (correctly) refuses to boot the pipeline. Proven live: the
      # first-ever CI run failed exactly here (2026-07-25, run 30157944913).
      ALLOW_DEV_SECRETS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: migrate
        run: npm run migrate -w ingest
      - name: workspace test suites (incl. gating action-safety eval)
        run: npm test
      - name: seed pipeline fixture for dbt
        run: npx tsx scripts/ci-fixture.ts
      # B7: pin the interpreter instead of riding whatever python the runner image ships
      # (bare `pip` changes under your feet on image updates). Version-pinned dbt +
      # pinned python make the cache key meaningful; with no requirements file,
      # cache-dependency-path keys the pip cache on this workflow file, which is where
      # the pinned dbt version lives — the key changes exactly when the pin does.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: .github/workflows/ci.yml
      - name: dbt build + data tests
        run: |
          pip install dbt-postgres==1.11.0
          cd warehouse && dbt build --profiles-dir .
        env:
          DBT_HOST: localhost
          DBT_PORT: "5433"
      - name: verify identity resolution against manifest
        run: npx tsx scripts/verify-identity.ts
