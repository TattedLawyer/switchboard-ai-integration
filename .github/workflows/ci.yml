name: ci
on:
  push:
  pull_request:
# B7: `push` + `pull_request` double-runs every PR-branch commit. One concurrency group
# per workflow+branch lets the newest run supersede its sibling ("only a single job or
# workflow using the same concurrency group will run at a time" — GitHub docs); the
# conditional keeps main-branch runs uncancelled, so a push to main never kills a
# release-relevant run mid-flight (the docs' own caveat on cancel-in-progress).
# Task F ride-along (register): `github.ref` alone did NOT dedupe across event types —
# a PR-branch commit runs as `refs/heads/<branch>` (push) AND `refs/pull/<n>/merge`
# (pull_request), two different refs, so the double-run B7 targeted survived between
# events (bitten live: the burn-wave PR run, 2026-08-01).
# Task G, SECOND attempt (register): F's fix
# (`github.event.pull_request.head.ref || github.ref`) STILL did not collapse the pair,
# observed live on the F push — the push event has no pull_request payload, so its arm
# falls through to `github.ref` = `refs/heads/<branch>`, while the PR event's
# `pull_request.head.ref` is the BARE `<branch>`: two spellings, two groups, both runs
# executed. Fix: normalize BOTH sides to the bare branch name — `github.head_ref` is
# the bare head branch on pull_request events (empty otherwise), `github.ref_name` is
# the bare branch on push events — so both events of one commit share one group.
# Expected on the next PR-branch push: ONE surviving CI run (the sibling cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  suite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: switchboard
          POSTGRES_PASSWORD: switchboard
          POSTGRES_DB: switchboard
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U switchboard"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      DATABASE_URL: postgres://switchboard:switchboard@localhost:5433/switchboard
      # CI runs the synthetic demo fixture on the published dev secrets BY DESIGN —
      # the same explicit opt-in demo.sh/chaos.sh declare. Without this, the A2
      # fail-closed gate (correctly) refuses to boot the pipeline. Proven live: the
      # first-ever CI run failed exactly here (2026-07-25, run 30157944913).
      ALLOW_DEV_SECRETS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: migrate
        run: npm run migrate -w ingest
      - name: workspace test suites (incl. gating action-safety eval)
        run: npm test
      - name: seed pipeline fixture for dbt
        run: npx tsx scripts/ci-fixture.ts
      # B7: pin the interpreter instead of riding whatever python the runner image ships
      # (bare `pip` changes under your feet on image updates). Version-pinned dbt +
      # pinned python make the cache key meaningful; with no requirements file,
      # cache-dependency-path keys the pip cache on this workflow file, which is where
      # the pinned dbt version lives — the key changes exactly when the pin does.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: .github/workflows/ci.yml
      - name: dbt build + data tests
        # dbt-core co-pinned exactly (phase-close F3) — same pin, same rationale as
        # warehouse/Dockerfile: dbt-postgres alone lets dbt-core float across majors.
        #
        # GREEN CRITERION FOR THIS STEP IS NOT "dbt exited 0". dbt exits 0 on warnings,
        # and this build is EXPECTED to report exactly one:
        #
        #     ERROR=0, WARN=1 — assert_amounts_plausible, row DEMO-CH-0001
        #
        # The CI fixture deliberately seeds one above-bound charge (close F7) so the
        # unlikely-value warn surface is proven to fire end-to-end in the built
        # warehouse instead of passing vacuously. A SECOND warn would therefore hide
        # behind this one, so the step below asserts the warn set exactly — do not read
        # this step's green tick as "no warnings".
        run: |
          pip install dbt-postgres==1.11.0 dbt-core==1.12.0
          cd warehouse && dbt build --profiles-dir .
        env:
          DBT_HOST: localhost
          DBT_PORT: "5433"
      - name: verify dbt warn set is exactly the expected one
        # Reads dbt's own run_results.json (complete warn set + per-test row counts) and
        # assert_amounts_plausible's stored failures (row identity). Fails on an extra
        # warn, a missing expected warn, or a different flagged row.
        run: npx tsx scripts/verify-dbt-warns.ts
      - name: verify identity resolution against manifest
        run: npx tsx scripts/verify-identity.ts
